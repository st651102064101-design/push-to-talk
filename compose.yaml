services:
  ptt-server:
    image: ptt-relay:1.2.0-docker
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ptt-relay
    restart: unless-stopped
    init: true
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "8181"
      PTT_DASHBOARD_ALLOW_REMOTE: "true"
    ports:
      - "${PTT_PORT:-8181}:8181"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const socket=net.connect(8181,'127.0.0.1',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
